<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="100 100 824 824" fill="none">
  <!--
    Infyield app icon.

    Follows the macOS icon grid: an 824×824 rounded square centred in a 1024
    canvas (100pt margins), so it sits correctly next to Apple's own icons in
    the Dock. The glyph is the same four-point sparkle the UI uses
    (src/components/icons.tsx → IconSparkle), drawn in the product's mint→cyan
    signal colours on the ink/glass surface, so the Dock, the nav brand and the
    in-app icons all read as one identity.

    Source of truth: `scripts/build-icon.sh` rasterises this to
    `infyield-icon.icns`. Edit here, never the .icns.
  -->
  <defs>
    <linearGradient id="plate" x1="230" y1="150" x2="820" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b1b26" />
      <stop offset="0.52" stop-color="#0a0a10" />
      <stop offset="1" stop-color="#0b1a15" />
    </linearGradient>
    <radialGradient id="glowMint" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse" gradientTransform="translate(700 300) scale(430)">
      <stop stop-color="#35e0a1" stop-opacity="0.34" />
      <stop offset="1" stop-color="#35e0a1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse" gradientTransform="translate(330 790) scale(400)">
      <stop stop-color="#46c8e8" stop-opacity="0.2" />
      <stop offset="1" stop-color="#46c8e8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spark" x1="300" y1="740" x2="740" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46c8e8" />
      <stop offset="0.55" stop-color="#3ad2b6" />
      <stop offset="1" stop-color="#35e0a1" />
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(200 200) scale(620)">
      <stop stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.022" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <clipPath id="plateClip">
      <rect x="100" y="100" width="824" height="824" rx="192" />
    </clipPath>
    <!-- Four-point sparkle: tips on the axes, sides pulled toward the centre.
         The control points sit ~19% of the radius off-axis — flatter than a
         hairline star, so the arms survive being scaled down to 16px. -->
    <path id="sparkle" d="M512 248 Q560 464 776 512 Q560 560 512 776 Q464 560 248 512 Q464 464 512 248 Z" />
  </defs>

  <!-- Baked depth, so the plate reads as glass on any wallpaper. -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="100" width="824" height="824" rx="192" fill="#0a0a10" />
  </g>

  <g clip-path="url(#plateClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#plate)" />
    <rect x="100" y="100" width="824" height="824" fill="url(#glowMint)" />
    <rect x="100" y="100" width="824" height="824" fill="url(#glowCyan)" />
    <!-- Specular highlight on the top-left, mirroring the glass sheen in-app.
         Radial and edge-free on purpose: a diagonal band or parallelogram
         leaves a straight edge that reads as a smudge at Dock size. -->
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)" />
  </g>

  <!-- Sparkle: a soft halo, the glyph, then a bright core. -->
  <use href="#sparkle" fill="url(#spark)" fill-opacity="0.55" filter="url(#soften)" />
  <use href="#sparkle" fill="url(#spark)" />
  <use href="#sparkle" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" />

  <!-- Inner rim: the same 1px highlight the app's glass surfaces carry. -->
  <rect x="100" y="100" width="824" height="824" rx="192" fill="none" stroke="url(#rim)" stroke-width="3" />
</svg>
